<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Gracefully shim dev WebSocket in Cloud Run preview iframe environments
      (function() {
        try {
          var RealWS = window.WebSocket;
          if (RealWS) {
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes(':3000')))) {
                var fake = new EventTarget();
                fake.readyState = 1;
                fake.binaryType = 'blob';
                fake.bufferedAmount = 0;
                fake.extensions = '';
                fake.protocol = 'vite-hmr';
                fake.url = url;
                fake.send = function() {};
                fake.close = function() {
                  fake.readyState = 3;
                  fake.dispatchEvent(new Event('close'));
                };
                setTimeout(function() {
                  fake.dispatchEvent(new Event('open'));
                }, 10);
                return fake;
              }
              return new RealWS(url, protocols);
            };
            window.WebSocket.prototype = RealWS.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ExpiTrack - Expiry Date & Warranty Tracker</title>
    <meta name="description" content="Personal vault that tracks expiry dates for groceries, medicines, and warranties with photo proof, smart OCR, and proactive reminders." />
    <meta property="og:title" content="ExpiTrack - Expiry Date & Warranty Tracker" />
    <meta property="og:description" content="Personal vault that tracks expiry dates for groceries, medicines, and warranties with photo proof, smart OCR, and proactive reminders." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Web App Manifest & Android / iOS App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#131b2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ExpiTrack" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('expitrack_theme');
          var isDark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

        // Service Worker registration for PWA & Android TWA
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
          });
        }
      })();
    </script>
  </head>
  <body class="bg-[#faf8ff] dark:bg-[#131b2e] text-[#131b2e] dark:text-[#faf8ff] antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
