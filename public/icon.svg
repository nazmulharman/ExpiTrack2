<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#005c55" />
      <stop offset="100%" stop-color="#131b2e" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="120" y1="100" x2="392" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6df5e1" />
      <stop offset="100%" stop-color="#005c55" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6df5e1" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Accent -->
  <path d="M64 256H448M256 64V448" stroke="#6df5e1" stroke-opacity="0.1" stroke-width="2" />
  
  <!-- Outer Shield Emblem -->
  <path d="M256 80 L384 136 V264 C384 352 328 416 256 440 C184 416 128 352 128 264 V136 Z" 
        fill="#131b2e" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#glow)" />
        
  <!-- Inner Shield Fill -->
  <path d="M256 104 L364 150 V260 C364 336 318 392 256 414 C194 392 148 336 148 260 V150 Z" 
        fill="#005c55" 
        fill-opacity="0.4" />

  <!-- Checkmark / Expiry Clock Symbol -->
  <circle cx="256" cy="240" r="56" stroke="#6df5e1" stroke-width="10" fill="#131b2e" />
  <polyline points="256,212 256,240 278,254" stroke="#6df5e1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Verified Badge -->
  <circle cx="330" cy="310" r="28" fill="#6df5e1" />
  <path d="M318 310 L326 318 L342 302" stroke="#005c55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
